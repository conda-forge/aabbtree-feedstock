schema_version: 1

context:
  name: aabbtree
  version: "2.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aabbtree-${{ version }}.tar.gz
  sha256: e1f101461d153979f61c81dfea2e1a22c37aa6737e538b936c31eb1362ea04d5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aabbtree
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pure Python implementation of d-dimensional AABB tree.
  license: MIT
  license_file: LICENSE.rst
  homepage: https://github.com/kip-hart/AABBTree

extra:
  recipe-maintainers:
    - jan-janssen
